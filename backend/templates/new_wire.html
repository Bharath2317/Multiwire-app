{% extends "base.html" %}
{% block title %}New Multi Wire{% endblock %}

{% block content %}
<div class="wizard">
  <div class="card">
    <div class="card-body p-4">
      <h3 class="mb-1">Create Multi Wire</h3>
      <p class="text-muted">Enter the set number to start tracking daily production.</p>

      <form method="POST">
        <label class="form-label fw-semibold" for="multiwire_no">Multi Wire Number</label>
        <input
          id="multiwire_no"
          name="multiwire_no"
          class="form-control form-control-lg"
          placeholder="2026-F3-0000351"
          value="{{ value or '' }}"
          autocomplete="off"
          autofocus
          required
        />

        <div class="d-flex justify-content-between mt-4">
          <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
          <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
