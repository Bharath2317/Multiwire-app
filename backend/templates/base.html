<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MultiWire{% endblock %} · Production System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav class="navbar mw-nav navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard.dashboard') }}">
          <i class="bi bi-diagram-3-fill me-2"></i>MultiWire
          <span class="fw-normal opacity-75 d-none d-sm-inline"
            >Production System</span
          >
        </a>
        <a href="{{ url_for('wire.new_wire') }}" class="btn btn-light btn-sm">
          <i class="bi bi-plus-lg"></i> New Multi Wire
        </a>
      </div>
    </nav>

    <main class="container py-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div
        class="alert alert-{{ category }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endwith %} {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3">MultiWire Production System</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
