services:
  - type: web
    name: multiwire
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 2 app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false   # you type this in the Render dashboard
      - key: DATABASE_URL
        sync: false   # paste your Postgres connection string
